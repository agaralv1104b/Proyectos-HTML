<!DOCTYPE html>
<html lang="es">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto</title>
    </head>
    <body>

        <header>

            <h1>Concesionario Garcia</h1>

            <nav class="menu">

                <ul>
                    <li><a href="./index.html">Inicio</a></li>
                    <li><a href="./vehiculos.html">Vehiculos</a></li>

                    <li><a href="./contacto.html">Contacto</a></li>
                </ul>

            </nav>

        </header>

        <main>

            <section class="contacto">

                <h2>Contacto</h2>

                <p>Si tienes alguna pregunta o necesitas más información, no dudes en ponerte en contacto con nosotros. Estamos aquí para ayudarte.</p>

                <form action="./contacto.html" method="post">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>

        
    </body>
</html>
